<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Flyer - Mobile Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            max-width: 100%;
            max-height: 100%;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #score {
            font-size: 32px;
            color: #FFD700;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #gameOverScreen.show {
            display: flex;
        }

        .game-over-content {
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            color: white;
        }

        .game-over-content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #FF6B6B;
        }

        .game-over-content p {
            font-size: 32px;
            margin: 10px 0;
            color: #FFD700;
        }

        .restart-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .restart-btn:active {
            transform: scale(0.95);
            background: #45a049;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
        }

        #startScreen.hidden {
            display: none;
        }

        .start-content {
            text-align: center;
            color: #333;
        }

        .start-content h1 {
            font-size: 56px;
            margin-bottom: 20px;
            color: #FF6B6B;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .start-content p {
            font-size: 20px;
            margin: 10px 0;
            color: #333;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 30px;
            border-radius: 15px;
            margin: 30px 20px;
            font-size: 18px;
            color: #333;
        }

        .start-btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 28px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .start-btn:active {
            transform: scale(0.95);
            background: #45a049;
        }

        @media (max-width: 600px) {
            #hud {
                top: 10px;
                left: 10px;
                font-size: 18px;
            }

            #score {
                font-size: 24px;
            }

            .game-over-content {
                padding: 30px 20px;
                border-radius: 15px;
            }

            .game-over-content h1 {
                font-size: 36px;
            }

            .game-over-content p {
                font-size: 24px;
            }

            .start-content h1 {
                font-size: 40px;
            }

            .instructions {
                font-size: 16px;
                margin: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud">
            Score: <span id="score">0</span>
        </div>

        <div id="startScreen">
            <div class="start-content">
                <h1>🎮 SKY FLYER 🎮</h1>
                <div class="instructions">
                    <p>📱 Tap/Click to make the bird fly</p>
                    <p>⬆️ Avoid the obstacles</p>
                    <p>🏆 Get the highest score!</p>
                </div>
                <button class="start-btn" onclick="startGame()">START GAME</button>
            </div>
        </div>

        <div id="gameOverScreen">
            <div class="game-over-content">
                <h1>GAME OVER!</h1>
                <p>Final Score: <span id="finalScore">0</span></p>
                <p>Best Score: <span id="bestScore">0</span></p>
                <button class="restart-btn" onclick="restartGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game variables
        const GRAVITY = 0.6;
        const FLAP_STRENGTH = -12;
        const PIPE_WIDTH = 80;
        const PIPE_GAP = 150;
        const PIPE_SPEED = 5;
        const SPAWN_RATE = 120;

        let gameState = 'start'; // 'start', 'playing', 'gameOver'
        let score = 0;
        let bestScore = localStorage.getItem('bestScore') ? parseInt(localStorage.getItem('bestScore')) : 0;
        let frameCount = 0;

        // Bird object
        const bird = {
            x: canvas.width * 0.2,
            y: canvas.height / 2,
            radius: 15,
            velocityY: 0,
            color: '#FFD700',

            flap: function() {
                this.velocityY = FLAP_STRENGTH;
            },

            update: function() {
                this.velocityY += GRAVITY;
                this.y += this.velocityY;

                // Boundary check
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    endGame();
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                }
            },

            draw: function() {
                // Draw bird body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y - 5, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + 6, this.y - 5, 3, 0, Math.PI * 2);
                ctx.fill();

                // Draw beak
                ctx.fillStyle = '#FF4500';
                ctx.beginPath();
                ctx.moveTo(this.x + this.radius, this.y);
                ctx.lineTo(this.x + this.radius + 10, this.y - 5);
                ctx.lineTo(this.x + this.radius + 10, this.y + 5);
                ctx.closePath();
                ctx.fill();
            }
        };

        // Pipes array
        let pipes = [];

        class Pipe {
            constructor() {
                this.x = canvas.width;
                this.gapY = Math.random() * (canvas.height - PIPE_GAP - 100) + 50;
                this.width = PIPE_WIDTH;
                this.scored = false;
            }

            update() {
                this.x -= PIPE_SPEED;
            }

            draw() {
                // Top pipe
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(this.x, 0, this.width, this.gapY);

                // Bottom pipe
                ctx.fillRect(this.x, this.gapY + PIPE_GAP, this.width, canvas.height - (this.gapY + PIPE_GAP));

                // Pipe highlight
                ctx.strokeStyle = '#45a049';
                ctx.lineWidth = 3;
                ctx.strokeRect(this.x, 0, this.width, this.gapY);
                ctx.strokeRect(this.x, this.gapY + PIPE_GAP, this.width, canvas.height - (this.gapY + PIPE_GAP));
            }

            isOffScreen() {
                return this.x + this.width < 0;
            }

            collidesWith(bird) {
                if (bird.x + bird.radius > this.x && bird.x - bird.radius < this.x + this.width) {
                    if (bird.y - bird.radius < this.gapY || bird.y + bird.radius > this.gapY + PIPE_GAP) {
                        return true;
                    }
                }
                return false;
            }
        }

        // Input handling
        document.addEventListener('click', handleInput);
        document.addEventListener('touchstart', handleInput);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                handleInput();
                e.preventDefault();
            }
        });

        function handleInput() {
            if (gameState === 'playing') {
                bird.flap();
            } else if (gameState === 'gameOver') {
                restartGame();
            }
        }

        function startGame() {
            gameState = 'playing';
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('show');
            score = 0;
            pipes = [];
            frameCount = 0;
            bird.y = canvas.height / 2;
            bird.velocityY = 0;
            gameLoop();
        }

        function endGame() {
            gameState = 'gameOver';
            document.getElementById('finalScore').textContent = score;
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bestScore', bestScore);
            }
            document.getElementById('bestScore').textContent = bestScore;
            document.getElementById('gameOverScreen').classList.add('show');
        }

        function restartGame() {
            startGame();
        }

        function update() {
            if (gameState !== 'playing') return;

            bird.update();

            // Spawn new pipes
            frameCount++;
            if (frameCount % SPAWN_RATE === 0) {
                pipes.push(new Pipe());
            }

            // Update pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].update();

                // Collision detection
                if (pipes[i].collidesWith(bird)) {
                    endGame();
                    return;
                }

                // Scoring
                if (!pipes[i].scored && pipes[i].x + pipes[i].width < bird.x) {
                    pipes[i].scored = true;
                    score++;
                    document.getElementById('score').textContent = score;
                }

                // Remove off-screen pipes
                if (pipes[i].isOffScreen()) {
                    pipes.splice(i, 1);
                }
            }
        }

        function draw() {
            // Clear canvas with gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw clouds
            drawClouds();

            // Draw pipes
            pipes.forEach(pipe => pipe.draw());

            // Draw bird
            bird.draw();
        }

        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            const cloudPositions = [
                { x: 100, y: 80, size: 1 },
                { x: 400, y: 150, size: 1.2 },
                { x: 700, y: 120, size: 0.9 },
                { x: 250, y: 300, size: 1.1 }
            ];

            cloudPositions.forEach(cloud => {
                const offsetX = (frameCount * 0.3) % (canvas.width + 200);
                const x = (cloud.x + offsetX) % (canvas.width + 200);
                drawCloud(x, cloud.y, 30 * cloud.size);
            });
        }

        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.arc(x + size * 0.8, y - size * 0.5, size * 0.8, 0, Math.PI * 2);
            ctx.arc(x + size * 1.6, y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            draw();

            if (gameState === 'playing') {
                requestAnimationFrame(gameLoop);
            }
        }

        // Display best score on load
        document.getElementById('bestScore').textContent = bestScore;
    </script>
</body>
</html>
